<!DOCTYPE html>
<html>
<head>
    <title>Products - AngadiMithra</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:#f4f6f9;
            padding:20px;
        }

        .container{
            max-width:1200px;
            margin:auto;
        }

        .header{
            background:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0px 2px 10px rgba(0,0,0,0.1);
            margin-bottom:20px;
        }

        .header h1{
            color:#400354;
        }

        .form-box{
            background:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0px 2px 10px rgba(0,0,0,0.1);
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            background:#7B1FA2;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#BF00FF;
        }

        .table-box{
            background:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0px 2px 10px rgba(0,0,0,0.1);
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#7B1FA2;
            color:white;
            padding:12px;
        }

        td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }

    </style>

</head>
<body>

<div class="container">

    <div class="header">
        <h1>📦 Product Management</h1>
    </div>

    <div class="form-box">

        <h2>Add Product</h2>

        <form method="POST" >
                        <input type="text"
                        name="product_name"
                   placeholder="Product Name"
                   required>

            <input type="number"
                   name="price" 
                   placeholder="Price"
                   required>

            <input type="number"
                   name="quantity"
                   placeholder="Quantity"
                   required>

            <button type="submit">
                Add Product
            </button>


    </div>

    <div class="table-box">

        <h2>Product List</h2>

        <table>

            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>

            {% for product in products %}

            <tr>
                <td>{{ product[0] }}</td>
                <td>{{ product[1] }}</td>
                <td>₹{{ product[2] }}</td>
                <td>{{ product[3] }}</td>
            </tr>

            {% endfor %}


        </table>

    </div>

</div>

</body>
</html>
