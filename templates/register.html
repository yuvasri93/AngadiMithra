<!DOCTYPE html>
<html>
<head>
    <title>Register-AngadiMithra</title>
    <style>

        body {
            font-family: 'Segoe UI',sans-serif;
            background:linear-gradient(to bottom,#BF00FF,#ffffff);
            margin:0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .logo{
            width: 100px;
            height: auto;
            display: block;
            margin: 0 auto 15px auto;
        }
        

        .container {
            width: 480px;
            margin: 150px auto;
            background:rgba(255,255,255,0.2);
            backdrop-filter:blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0px 4px 30px gray;
        }

        h2 {
            color:#400354;
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 25px;


        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background:#5b02788d;
            color: white;
            border: none;
            border-radius:8px;
            cursor: pointer;
        }

        button:hover {
            background: #BF00FF;
        }
    </style>
</head>
<body>


<div class="container">
    <img src="{{url_for('static',filename='image/brandlogo.jpeg')}}"
     alt="Logo"
     class="logo">


    <h2>AngadiMithra Registration</h2>

    <form method="POST">
        <label>Full Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Register</button>
    </form>
</div>

</body>
</html>
